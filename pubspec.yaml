name: esquadrao_comercial
description: "Plataforma profissional de telemarketing para tratamento, distribuicao e acompanhamento de leads."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Centralized Database
  supabase_flutter: ^2.8.0

  # Hardware, Calling & Integrations
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  # Architecture, State Management & Environment
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

  # Data Formatting & Utilities
  intl: ^0.19.0
  csv: ^6.0.0

  # UI, Icons, Charts & File Handling
  fl_chart: ^0.69.0
  file_picker: ^8.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
